<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Job Tracker</h1>

      <section id="auth-view" hidden>
        <p class="subtitle">Sign in to save job offers.</p>
        <button id="open-options" type="button" class="button-primary">
          Iniciar sesión
        </button>
      </section>

      <section id="connected-view" hidden>
        <p id="session-email" class="session-email"></p>
        <p id="api-url" class="api-url"></p>

        <button id="save-tab" type="button" class="button-primary">
          Guardar pestaña actual
        </button>

        <button id="logout" type="button" class="button-secondary">
          Logout
        </button>
      </section>

      <section id="confirm-view" hidden>
        <h2 class="section-title">Confirm application</h2>

        <form id="confirm-form" class="form">
          <label>
            Company
            <input id="company" type="text" placeholder="Company name" required />
          </label>

          <label>
            Position
            <input id="position" type="text" placeholder="Job title" required />
          </label>

          <label>
            Platform
            <select id="platform"></select>
          </label>

          <label>
            Source URL
            <input id="source-url" type="url" readonly />
          </label>

          <label>
            Notes
            <textarea id="notes" rows="3" placeholder="Optional notes"></textarea>
          </label>

          <div class="actions">
            <button type="button" id="cancel-confirm" class="button-secondary">
              Cancel
            </button>
            <button type="submit" id="save-application" class="button-primary">
              Add application
            </button>
          </div>
        </form>

        <p id="confirm-status" class="status-message" hidden></p>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
