<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker — Settings</title>
    <link rel="stylesheet" href="../popup/popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Job Tracker</h1>
      <p class="subtitle">Sign in to save job offers from your browser.</p>

      <form id="login-form" class="form">
        <label>
          API URL
          <input
            id="api-base-url"
            type="url"
            placeholder="https://job-tracker-fullstack-z6cy.onrender.com"
            required
          />
        </label>

        <label>
          Email
          <input id="email" type="email" autocomplete="username" required />
        </label>

        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <button type="submit" id="login-button">Sign in</button>
      </form>

      <p id="status-message" class="status-message" hidden></p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
